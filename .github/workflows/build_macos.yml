name: Build macOS app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Keep the link under the 7GB RAM limit on standard macOS runners.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  build_macos:
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf \
            /Users/runner/Library/Android \
            /Users/runner/Library/Developer/CoreSimulator \
            /Users/runner/.dotnet \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL || true
          # Drop unused Apple platforms; keep the selected Xcode.app intact.
          xcode_root="$(xcode-select -p)/Platforms"
          sudo rm -rf \
            "${xcode_root}/WatchOS.platform" \
            "${xcode_root}/AppleTVOS.platform" \
            "${xcode_root}/XROS.platform" || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add aarch64-apple-darwin

      - name: Install build dependencies
        run: |
          brew install cmake
          # Prefer the full Xcode install when present.
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          fi
          sudo xcodebuild -license accept || true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: macos-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            macos-cargo-

      - name: Bundle macOS app
        run: ./script/bundle-mac aarch64-apple-darwin

      - name: Prepare release asset
        id: asset
        run: |
          set -euxo pipefail
          short_sha="${GITHUB_SHA::7}"
          src="target/aarch64-apple-darwin/release/Zed-aarch64.dmg"
          dst="Zed-macos-aarch64-${short_sha}.dmg"
          test -f "$src"
          cp "$src" "$dst"
          echo "path=$dst" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          ls -lh "$dst"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          tag="macos"
          title="macOS build (${{ steps.asset.outputs.short_sha }})"
          notes="$(cat <<EOF
          Unsigned Apple Silicon (aarch64) build from \`${GITHUB_SHA}\`.

          **First launch:** macOS Gatekeeper will block this DMG because it is not notarized. Right-click the app → Open, or allow it under System Settings → Privacy & Security.

          Built by workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.asset.outputs.path }}" --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --prerelease
          else
            gh release create "$tag" "${{ steps.asset.outputs.path }}" \
              --title "$title" \
              --notes "$notes" \
              --prerelease
          fi
